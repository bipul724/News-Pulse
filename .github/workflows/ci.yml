# Runs every test suite on each push and pull request.
# Offline only: the scraper's live checks stay skipped (RUN_INTEGRATION_TESTS unset),
# and the backend tests mock Prisma, so no database or secrets are needed.
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # >= 22.18 runs the generated TypeScript Prisma client natively
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  scraper:
    name: Scraper tests (unittest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # the version the production image uses; SciPy 1.17 needs >= 3.11
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Build-time value only; nothing is called during the build.
      NEXT_PUBLIC_API_URL: https://news-pulse-api-tgxl.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: API Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same build Render runs; catches missing dependencies before deploying.
      - run: docker build -f backend/Dockerfile -t news-pulse-api .
